# yaml-language-server: $schema=values.schema.json

# Default values for kiwix.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# type: integer
# minimum: 0
# description: |
#   Number of Deployment replicas to run.
#
#   This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# type: object
# description: |
#   This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  # The image url
  repository: ghcr.io/kiwix/kiwix-serve
  # enum: [Always, IfNotPresent, Never]
  # description: This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# type: array
# description: |
#   This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []

# This is to override the chart name.
nameOverride: ""

# type: string
# description: This is to override the fully qualified app name used for resource names.
fullnameOverride: ""

# args for the kiwix command
args: ["/data/zims/*"]

# type: object
# description: |
#   This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # type: boolean
  # description: Automatically mount a ServiceAccount's API credentials?
  automount: true
  # type: object
  # description: Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# type: object
# description: |
#   This is for setting Kubernetes Annotations to a Pod.
#   For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# type: object
# description: |
#   This is for setting Kubernetes Labels to a Pod.
#   For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# type: object
# description: |
#   Security context settings applied to the pod. See: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
podSecurityContext: {}
  # fsGroup: 2000

# type: object
# description: |
#   Security context settings applied to the kiwix container. See: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# type: object
# description: |
#   This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # type: string
  # enum: [ClusterIP, NodePort, LoadBalancer, ExternalName]
  # description: |
  #   The Kubernetes Service type to create. See https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types for more information.
  type: ClusterIP
  # type: integer
  # description: |
  #   The port the Service listens on for the Kiwix container. See https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports for more information.
  port: 80

# type: object
# description: |
#   This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # type: boolean
  # description: Whether to create an Ingress resource for kiwix.
  enabled: false
  # type: string
  # description: The name of the IngressClass to use for this Ingress.
  className: ""
  # type: object
  # description: Annotations to add to the Ingress resource.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # type: array
  # description: |
  #   List of hosts and their path rules to route to the kiwix service.
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # type: array
  # description: TLS configuration for the Ingress, mapping secretNames to hosts.
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Resource requirements for the kiwix container.
# - [reference docs](https://kubernetes.io/docs/reference/kubernetes-api/workload-resources/pod-v1/#resources)
# - [schema](https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.ResourceRequirements)
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# type: object
# description: |
#   This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe:
  # $ref: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/v1.34.0/_definitions.json#/definitions/io.k8s.api.core.v1.Probe
  httpGet:
    path: /
    port: http

# type: object
# description: |
#   Readiness probe configuration for the kiwix container. See: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
readinessProbe:
  # type: object
  # description: HTTP GET action used to perform the readiness check.
  httpGet:
    # type: string
    # description: The path to request on the HTTP server for the readiness check.
    path: /
    # type: string
    # description: The named container port to probe for the readiness check.
    port: http

# type: object
# description: |
#   This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  # type: boolean
  # description: Whether to create a HorizontalPodAutoscaler for kiwix. When enabled, replicaCount is ignored.
  enabled: false
  # type: integer
  # minimum: 1
  # description: Minimum number of replicas the HorizontalPodAutoscaler will scale down to.
  minReplicas: 1
  # type: integer
  # minimum: 1
  # description: Maximum number of replicas the HorizontalPodAutoscaler will scale up to.
  maxReplicas: 100
  # type: integer
  # description: Target average CPU utilization percentage used to trigger scaling.
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# Additional volumeClaims to create.
volumeClaimTemplates: []
# - metadata:
#     name: kiwix-data
#   spec:
#     accessModes: ["ReadWriteOnce"]
#     resources:
#       requests:
#         storage: 1Gi
#     storageClassName: standard

# type: object
# description: |
#   Node labels for pod assignment. See: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
nodeSelector: {}

# type: array
# description: |
#   Tolerations for pod assignment. See: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
tolerations: []

# type: object
# description: |
#   Affinity and anti-affinity rules for pod assignment. See: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#affinity-and-anti-affinity
affinity: {}
