version: '3'

tasks:
  repos:
    desc: Add Helm chart repositories required by this chart's dependencies
    run: once
    cmds:
      - helm repo add bjw-s https://bjw-s-labs.github.io/helm-charts
    silent: true

  deps:
    desc: Build/update chart dependencies
    deps: [repos]
    cmds:
      - helm dependency build .

  lint:
    desc: Run `helm lint` and check that values.schema.json/README.md are up to date
    deps: [deps]
    cmds:
      - |
        set -e
        extra_values=()
        if [ -d ci ]; then
          for f in ci/*.yaml; do
            extra_values+=(-f "$f")
          done
        fi
        helm lint "${extra_values[@]}" .
      - |
        set -e
        if [ "$(helm values schema . --dry-run --stdout 2>/dev/null)" != "$(cat values.schema.json 2>/dev/null)" ]; then
          echo "values.schema.json is stale — run 'helm values schema .' to regenerate" >&2
          exit 1
        fi
        if [ "$(helm values docs . --dry-run --stdout 2>/dev/null)" != "$(cat README.md 2>/dev/null)" ]; then
          echo "README.md is stale — run 'helm values docs .' to regenerate" >&2
          exit 1
        fi

  template:
    desc: Render this chart with `helm template` to catch templating errors
    deps: [deps]
    cmds:
      - |
        set -e
        extra_values=()
        if [ -d ci ]; then
          for f in ci/*.yaml; do
            extra_values+=(-f "$f")
          done
        fi
        helm template "${extra_values[@]}" "$(basename "$PWD")" . > /dev/null

  test:
    desc: Lint and render this chart (static validation, no cluster required)
    cmds:
      - task: lint
      - task: template

  default:
    desc: Alias for test
    cmds:
      - task: test
