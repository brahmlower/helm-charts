# yaml-language-server: $schema=values.schema.json

# Default values for ..
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# type: integer
# description: The number of pod replicas to run.
replicaCount: 1

# type: object
# description: Container image configuration.
image:
  # type: string
  # description: The container image repository to pull the Actual Budget server image from.
  repository: docker.io/actualbudget/actual-server
  # type: string
  # enum: [Always, IfNotPresent, Never]
  # description: The image pull policy controlling when Kubernetes re-pulls the image.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# type: array
# description: A list of secrets used for pulling the image from a private container registry.
imagePullSecrets: []
# type: string
# description: Overrides the name of the chart used to generate resource names.
nameOverride: ""
# type: string
# description: Overrides the full name of the release used to generate resource names.
fullnameOverride: ""

# type: object
# description: Configuration for the Kubernetes ServiceAccount used by the pod.
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# type: object
# description: Annotations to add to the pod.
podAnnotations: {}
# type: object
# description: Labels to add to the pod.
podLabels: {}

# type: object
# description: Security context settings applied at the pod level.
podSecurityContext: {}
  # fsGroup: 2000

# type: object
# description: Security context settings applied at the container level.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# type: object
# description: Kubernetes Service configuration for exposing the application.
service:
  # type: string
  # enum: [ClusterIP, NodePort, LoadBalancer, ExternalName]
  # description: The type of Kubernetes Service to create.
  type: ClusterIP
  # type: integer
  # description: The port the Service listens on.
  port: 80

# type: array
# description: A list of environment variables to set on the application container.
env:
  - name: ACTUAL_PORT
    value: "5006"

# type: object
# description: Ingress configuration for exposing the application outside the cluster.
ingress:
  # type: boolean
  # description: Whether to create an Ingress resource.
  enabled: false
  # type: string
  # description: The IngressClass to use for the Ingress resource.
  className: nginx
  # type: object
  # description: Annotations to add to the Ingress resource.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # type: array
  # description: A list of host rules used to configure the Ingress.
  hosts:
    - host: actual-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # type: array
  # description: TLS configuration for the Ingress, specifying secrets and the hosts they cover.
  tls: []
  # tls:
  #   - secretName: actual-example-tls
  #     hosts:
  #       - actual-example.local

# type: object
# description: Resource requests and limits for the application container.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# type: object
# description: Liveness probe configuration used by Kubernetes to determine if the container needs to be restarted.
livenessProbe:
  # type: object
  # description: HTTP GET probe configuration for the liveness check.
  httpGet:
    # type: string
    # description: The HTTP path the liveness probe requests.
    path: /
    # type: integer
    # description: The port the liveness probe connects to.
    port: 5006
# type: object
# description: Readiness probe configuration used by Kubernetes to determine if the container is ready to receive traffic.
readinessProbe:
  # type: object
  # description: HTTP GET probe configuration for the readiness check.
  httpGet:
    # type: string
    # description: The HTTP path the readiness probe requests.
    path: /
    # type: integer
    # description: The port the readiness probe connects to.
    port: 5006

# type: object
# description: Horizontal Pod Autoscaler configuration.
autoscaling:
  # type: boolean
  # description: Whether to create a HorizontalPodAutoscaler for this deployment.
  enabled: false
  # type: integer
  # description: The minimum number of replicas the autoscaler will scale down to.
  minReplicas: 1
  # type: integer
  # description: The maximum number of replicas the autoscaler will scale up to.
  maxReplicas: 2
  # type: integer
  # description: The target average CPU utilization percentage used to trigger scaling.
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# type: object
# description: Node selector labels used to constrain which nodes the pod can be scheduled on.
nodeSelector: {}

# type: array
# description: Tolerations allowing the pod to be scheduled onto nodes with matching taints.
tolerations: []

# type: object
# description: Affinity and anti-affinity rules used to constrain pod scheduling.
affinity: {}

# type: object
# description: Persistent storage configuration for the application data.
persistence:
  # type: object
  # description: Configuration for the data volume used to persist application data.
  data:
    # type: string
    # description: The name of an existing PersistentVolumeClaim to use for storing application data.
    persistentVolumeClaim: actual-data
