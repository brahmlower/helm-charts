# yaml-language-server: $schema=values.schema.json
# Default values for bentopdf.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
# type: integer
# description: The number of pod replicas to run.
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
# type: object
# description: Container image configuration for the bentopdf deployment.
image:
  # type: string
  # description: The container image repository to pull the bentopdf image from.
  repository: bentopdf/bentopdf-simple
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
# type: array
# description: A list of secrets used for pulling the bentopdf image from a private container registry.
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
# type: string
# description: Overrides the fully qualified name of the release used to generate resource names.
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
# type: object
# description: Configuration for the Kubernetes ServiceAccount used by the bentopdf pod.
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/

# type: object
# description: Annotations applied to the bentopdf pod.
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/

# type: object
# description: Labels applied to the bentopdf pod.
podLabels: {}

# type: object
# description: Security context settings applied to the pod as a whole, such as fsGroup.
podSecurityContext: {}
  # fsGroup: 2000

# type: object
# description: Security context settings applied to the bentopdf container, such as capabilities or runAsUser.
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
# type: object
# description: Kubernetes Service configuration for exposing bentopdf.
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types

  # type: string
  # enum: [ClusterIP, NodePort, LoadBalancer, ExternalName]
  # description: The Kubernetes Service type used to expose bentopdf.
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports

  # type: integer
  # description: The port the bentopdf Service listens on.
  port: 8080

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
# type: object
# description: Kubernetes Ingress configuration for exposing bentopdf outside the cluster.
ingress:
  # type: boolean
  # description: Whether to create an Ingress resource for bentopdf.
  enabled: false
  # type: string
  # description: The IngressClass to use for the Ingress resource.
  className: ""
  # type: object
  # description: Annotations applied to the Ingress resource, such as ingress controller or TLS options.
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # type: array
  # description: The list of hostnames and paths routed to the bentopdf service.
  hosts:
    - host: bentopdf.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  # type: array
  # description: TLS configuration for the Ingress, mapping secret names to hostnames.
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)

# type: object
# description: Gateway API HTTPRoute configuration for exposing bentopdf as an alternative to Ingress.
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# type: object
# description: Container resource requests and limits for the bentopdf container.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# type: object
# description: Liveness probe configuration used by Kubernetes to detect and restart an unhealthy bentopdf container.
livenessProbe:
  # type: object
  # description: HTTP GET probe settings for the liveness check.
  httpGet:
    # type: string
    # description: The HTTP path the liveness probe requests.
    path: /
    # type: string
    # description: The named container port the liveness probe targets.
    port: http
# type: object
# description: Readiness probe configuration used by Kubernetes to determine when the bentopdf container can receive traffic.
readinessProbe:
  # type: object
  # description: HTTP GET probe settings for the readiness check.
  httpGet:
    # type: string
    # description: The HTTP path the readiness probe requests.
    path: /
    # type: string
    # description: The named container port the readiness probe targets.
    port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
# type: object
# description: HorizontalPodAutoscaler configuration for bentopdf.
autoscaling:
  # type: boolean
  # description: Whether to create a HorizontalPodAutoscaler for bentopdf, replacing the static replicaCount.
  enabled: false
  # type: integer
  # description: The minimum number of pod replicas the autoscaler will maintain.
  minReplicas: 1
  # type: integer
  # description: The maximum number of pod replicas the autoscaler is allowed to scale up to.
  maxReplicas: 100
  # type: integer
  # description: The target average CPU utilization percentage the autoscaler scales towards.
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

# type: object
# description: Node labels used to constrain which nodes the bentopdf pod can be scheduled on.
nodeSelector: {}

# type: array
# description: Tolerations allowing the bentopdf pod to be scheduled onto nodes with matching taints.
tolerations: []

# type: object
# description: Node and pod affinity or anti-affinity rules for scheduling the bentopdf pod.
affinity: {}
