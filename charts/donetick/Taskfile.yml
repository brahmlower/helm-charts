version: '3'

tasks:
  deps:
    desc: Build/update chart dependencies (none for this chart)

  lint:
    desc: Run `helm lint` and check that values.schema.json/README.md are up to date
    deps: [deps]
    silent: true
    cmds:
      - helm lint .
      - |
        set -e
        if [ "$(helm values schema . --dry-run --stdout 2>/dev/null)" != "$(cat values.schema.json 2>/dev/null)" ]; then
          echo "values.schema.json is stale — run 'helm values schema .' to regenerate" >&2
          exit 1
        fi
        if [ "$(helm values docs . --dry-run --stdout 2>/dev/null)" != "$(cat README.md 2>/dev/null)" ]; then
          echo "README.md is stale — run 'helm values docs .' to regenerate" >&2
          exit 1
        fi
      - |
        set -e
        chart_info="$(helm show chart .)"
        chart_name="$(echo "$chart_info" | grep '^name:' | awk '{print $2}')"
        chart_version="$(echo "$chart_info" | grep '^version:' | awk '{print $2}')"
        schema_url="$(echo "$chart_info" | grep 'values-schema:' | awk '{print $2}')"
        expected_tag="${chart_name}-${chart_version}"
        if [[ "$schema_url" != *"/refs/tags/${expected_tag}/"* ]]; then
          echo "annotations.values-schema does not reference tag '${expected_tag}' (found: ${schema_url:-<unset>}) — update it to match the current chart version" >&2
          exit 1
        fi

  template:
    desc: Render this chart with `helm template` to catch templating errors
    deps: [deps]
    cmds:
      - helm template "$(basename "$PWD")" . > /dev/null

  test:
    desc: Lint and render this chart (static validation, no cluster required)
    cmds:
      - task: lint
      - task: template

  default:
    desc: Alias for test
    cmds:
      - task: test
