# This is the donetick configuration: https://docs.donetick.com/getting-started/configration
config:
  name: "selfhosted"
  is_done_tick_dot_com: false
  is_user_creation_disabled: false
  telegram:
    token: ""
  pushover:
    token: ""
  database:
    # enum: [sqlite, postgres]
    type: "sqlite"
    migration: true
    host: "donetick-cnpg.default.svc.cluster.local"
    port: 5432
    user: "donetick"
    # The DT_DATABASE_PASSWORD environment variable should be used instead of this field.
    password: ""
    name: donetick
  jwt:
    # The DT_JWT_SECRET environment variable should be used instead of this field.
    secret: ""
    session_time: 168h
    max_refresh: 168h
  server:
    port: 2021
    read_timeout: 10s
    write_timeout: 10s
    rate_period: 60s
    rate_limit: 300
    cors_allow_origins:
      - "http://localhost:5173"
      - "http://localhost:7926"
      # the below are required for the android app to work
      - "https://localhost"
      - "capacitor://localhost"
    serve_frontend: true
  logging:
    level: "info"
    encoding: "json"
    development: false
  scheduler_jobs:
    due_job: 30m
    overdue_job: 3h
    pre_due_job: 3h
  email:
    host: ""
    port: 0
    # ---
    # The DT_EMAIL_KEY environment variable should be used instead of this field.
    key: ""
    email: ""
    appHost: ""
  oauth2:
    client_id: ""
    # ---
    # The DT_OAUTH2_CLIENT_SECRET environment variable should be used instead of this field.
    client_secret: ""
    auth_url: ""
    token_url: ""
    user_info_url: ""
    redirect_url: ""
    name: ""
  # Real-time configuration
  realtime:
    enabled: true
    sse_enabled: true
    heartbeat_interval: 60s
    connection_timeout: 120s
    max_connections: 1000
    max_connections_per_user: 5
    event_queue_size: 2048
    cleanup_interval: 2m
    stale_threshold: 5m
    enable_compression: true
    enable_stats: true
    allowed_origins:
      - "*"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

# $ref: https://raw.githubusercontent.com/instrumenta/kubernetes-json-schema/refs/heads/master/v1.18.1/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"

  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# We usually recommend not to specify default resources and to leave this as a conscious
# choice for the user. This also increases chances charts run on environments with little
# resources, such as Minikube. If you do want to specify resources, uncomment the following
# lines, adjust them as necessary, and remove the curly braces after 'resources:'.
resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# livenessProbe:
#   httpGet:
#     path: /
#     port: http
#   initialDelaySeconds: 60
# readinessProbe:
#   httpGet:
#     path: /
#     port: http
#   initialDelaySeconds: 30

# description: This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
